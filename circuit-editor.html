<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회로 그리기 · 테브난/노턴 (R·L·C)</title>
<style>
  :root{ --bg:#0f1216; --panel:#161b22; --line:#2a323d; --txt:#e6edf3; --dim:#9aa7b4;
         --acc:#58a6ff; --warn:#f0883e; --ok:#3fb950; --red:#f85149; --wire:#8b949e; --pur:#bc8cff; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
       padding:16px 14px 40px;-webkit-text-size-adjust:100%}
  h1{font-size:19px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .chip{font:inherit;font-size:13px;padding:7px 12px;border-radius:8px;cursor:pointer;
        border:1px solid var(--line);background:var(--bg);color:var(--txt)}
  .chip.on{border-color:var(--acc);color:var(--acc);font-weight:700}
  .chip.danger{border-color:var(--red);color:var(--red)}
  .chip.go{border-color:var(--ok);color:var(--ok)}
  input[type=number]{width:92px;background:var(--bg);border:1px solid var(--line);border-radius:8px;
        color:var(--txt);font:inherit;font-size:14px;padding:6px 8px}
  .hint{font-size:12.5px;color:var(--dim);margin-top:8px}
  .hint b{color:var(--txt)}
  svg{width:100%;max-width:980px;max-height:660px;height:auto;display:block;margin:0 auto;
      background:var(--bg);border-radius:8px;touch-action:none}
  .res{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:9px}
  .v{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px}
  .v .k{font-size:11px;color:var(--dim)} .v .n{font-size:15.5px;font-variant-numeric:tabular-nums}
  .v .u{font-size:11px;color:var(--dim)}
  .v.hi{border-color:var(--acc)}
  .chk{font-size:12.5px;display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dashed var(--line)}
  .chk:last-child{border-bottom:0}
  .ok{color:var(--ok)} .bad{color:var(--warn)}
  .steps{display:grid;gap:9px}
  .step{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
  .step .fh{font-size:12.5px;font-weight:600;color:var(--acc)}
  .step .why{font-size:11.5px;color:var(--dim);margin:2px 0 6px}
  .sel{font-size:12.5px;color:var(--dim)}
  .sel b{color:var(--acc)}
</style>
</head>
<body>

<h1>회로 그리기 · 테브난 / 노턴 (R · L · C)</h1>
<div class="sub">점에서 점으로 드래그해 소자를 놓습니다. 저항·코일·콘덴서·전원을 섞어 그릴 수 있습니다.</div>

<div class="card">
  <div class="toolbar">
    <button class="chip on" data-tool="R">저항 R</button>
    <button class="chip" data-tool="L">코일 L</button>
    <button class="chip" data-tool="C">콘덴서 C</button>
    <button class="chip" data-tool="V">전압원 V</button>
    <button class="chip" data-tool="I">전류원 I</button>
    <button class="chip" data-tool="W">도선 W</button>
    <span style="width:8px"></span>
    <label style="font-size:12px;color:var(--dim)">값</label>
    <input id="valIn" type="number" step="any" value="10">
    <span id="unitLbl" style="font-size:12px;color:var(--dim)">Ω</span>
    <span id="phaseWrap" style="display:none">
      <label style="font-size:12px;color:var(--dim);margin-left:4px">위상°</label>
      <input id="phIn" type="number" step="any" value="0" style="width:74px">
    </span>
  </div>
  <div class="toolbar" style="margin-top:10px">
    <label style="font-size:12px;color:var(--dim)">주파수 f</label>
    <input id="freq" type="number" step="any" value="1000">
    <span style="font-size:12px;color:var(--dim)">Hz (0 = 직류)</span>
    <span style="width:10px"></span>
    <button class="chip go" id="setA">이 점을 A 단자로</button>
    <button class="chip go" id="setB">이 점을 B 단자로</button>
    <button class="chip" id="flip">방향 반전</button>
    <button class="chip danger" id="delSel">선택 삭제</button>
    <button class="chip danger" id="clearAll">전체 지우기</button>
  </div>
  <div class="toolbar" style="margin-top:10px">
    <span style="font-size:12px;color:var(--dim)">예제</span>
    <button class="chip" id="load1">① RC 저역통과</button>
    <button class="chip" id="load2">② R + L + C</button>
    <button class="chip" id="load3">③ 저항만 (직류)</button>
  </div>
  <div class="hint" id="hint">
    <b>점에서 다른 점으로 드래그</b>하면 소자가 놓입니다(가로·세로). 소자를 누르면 선택되어 값 수정·삭제가 됩니다.
    빈 점을 누르면 그 점이 선택됩니다(A/B 단자 지정용). <b>도선(W)</b>은 지나가는 점을 모두 연결합니다.
    코일은 <b>mH</b>, 콘덴서는 <b>µF</b> 단위로 넣습니다.
  </div>
  <div class="sel" id="selInfo" style="margin-top:8px"></div>
</div>

<div class="card">
  <div id="canvasWrap"></div>
  <div class="hint" id="warnLine" style="color:var(--warn)"></div>
</div>

<div class="card"><div class="res" id="results"></div></div>

<div class="card">
  <div style="font-size:13px;font-weight:600;margin-bottom:8px">단계별 축소 (전원을 끄고 Z_th 구하기)</div>
  <div class="steps" id="stepsPanel"></div>
</div>

<div class="card">
  <div style="font-size:13px;font-weight:600;margin-bottom:8px">일관성 자동 검사</div>
  <div id="checks"></div>
</div>

<script>
const C=(re,im)=>({re:re,im:im});
const cadd=(a,b)=>C(a.re+b.re,a.im+b.im);
const csub=(a,b)=>C(a.re-b.re,a.im-b.im);
const cmul=(a,b)=>C(a.re*b.re-a.im*b.im, a.re*b.im+a.im*b.re);
const cdiv=(a,b)=>{const d=b.re*b.re+b.im*b.im; return C((a.re*b.re+a.im*b.im)/d,(a.im*b.re-a.re*b.im)/d);};
const cabs=a=>Math.hypot(a.re,a.im);
const cang=a=>Math.atan2(a.im,a.re)*180/Math.PI;
const pol=(m,deg)=>C(m*Math.cos(deg*Math.PI/180), m*Math.sin(deg*Math.PI/180));

const STEP=40, MARGIN=44, COLS=17, ROWS=9;
const W=COLS*STEP+MARGIN*2, H=ROWS*STEP+MARGIN*2;
let tool='R', elements=[], termA=null, termB=null, sel=null, dragFrom=null, dragTo=null;
let seq=1, fHz=1000;

const key=p=>p[0]+','+p[1];
const gx=i=>MARGIN+i*STEP, gy=j=>MARGIN+j*STEP;
const fmt=(v,d)=>{ d=(d===undefined)?3:d;
  return v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}); };
const fz=z=>fmt(cabs(z),3)+' ∠ '+fmt(cang(z),1)+'°';
const fzR=z=>'('+fmt(z.re,3)+(z.im>=0?' + j':' − j')+fmt(Math.abs(z.im),3)+')';

const wOf=()=>2*Math.PI*fHz;
function Zof(e){
  if(e.type==='R') return C(e.val,0);
  if(e.type==='L') return C(0, wOf()*e.val);
  if(e.type==='C') return (fHz>0 && e.val>0) ? C(0, -1/(wOf()*e.val)) : C(1e15,0);
  return C(0,0);
}
const isShort=e=> e.type==='W' || (e.type==='R' && Math.abs(e.val)<1e-12) || (e.type==='L' && fHz===0);
const isOpen =e=> e.type==='C' && fHz===0;

function buildNodes(els){
  const parent={};
  const find=k=>{ if(!(k in parent)) parent[k]=k;
    while(parent[k]!==k){ parent[k]=parent[parent[k]]; k=parent[k]; } return k; };
  const union=(a,b)=>{ const ra=find(a),rb=find(b); if(ra!==rb) parent[ra]=rb; };
  els.forEach(e=>{ find(key(e.p1)); find(key(e.p2)); });
  els.forEach(e=>{ if(e.type!=='W' && isShort(e)) union(key(e.p1),key(e.p2)); });
  els.filter(e=>e.type==='W').forEach(e=>{
    const [i1,j1]=e.p1,[i2,j2]=e.p2;
    if(j1===j2){ const s=Math.min(i1,i2), t=Math.max(i1,i2);
      for(let i=s;i<t;i++) union(i+','+j1,(i+1)+','+j1); }
    else if(i1===i2){ const s=Math.min(j1,j2), t=Math.max(j1,j2);
      for(let j=s;j<t;j++) union(i1+','+j,i1+','+(j+1)); }
    else union(key(e.p1),key(e.p2));
  });
  const map={}; Object.keys(parent).forEach(k=>map[k]=find(k));
  return {map:map, find:find};
}

function resolved(els){
  const b=buildNodes(els), map=b.map;
  const out=[];
  els.forEach(e=>{
    if(e.type==='W' || isOpen(e) || isShort(e)) return;
    const a=map[key(e.p1)]||key(e.p1), b2=map[key(e.p2)]||key(e.p2);
    out.push({t:e.type, a:a, b:b2, z:Zof(e), val:e.val, id:e.id, name:e.name,
              src:(e.type==='V'||e.type==='I')?pol(e.val,e.phase||0):null});
  });
  return {els:out, map:map};
}

function solveC(nodes, els, ref){
  const list=Object.keys(nodes).filter(n=>n!==ref);
  const idx={}; list.forEach((n,i)=>idx[n]=i);
  const vs=els.filter(e=>e.t==='V');
  const n=list.length+vs.length;
  if(n===0) return {v:{}, xa:[], base:0, nv:0};
  const A=[], b=[];
  for(let i=0;i<n;i++){ A.push(new Array(n).fill(null).map(()=>C(0,0))); b.push(C(0,0)); }
  els.forEach(e=>{
    if(e.t==='V'||e.t==='I') return;
    const y=cdiv(C(1,0), e.z);
    const a=e.a, c=e.b;
    if(a!==ref){ A[idx[a]][idx[a]]=cadd(A[idx[a]][idx[a]],y); if(c!==ref) A[idx[a]][idx[c]]=csub(A[idx[a]][idx[c]],y); }
    if(c!==ref){ A[idx[c]][idx[c]]=cadd(A[idx[c]][idx[c]],y); if(a!==ref) A[idx[c]][idx[a]]=csub(A[idx[c]][idx[a]],y); }
  });
  els.forEach(e=>{
    if(e.t!=='I') return;
    if(e.a!==ref) b[idx[e.a]]=csub(b[idx[e.a]], e.src);
    if(e.b!==ref) b[idx[e.b]]=cadd(b[idx[e.b]], e.src);
  });
  vs.forEach((e,k)=>{
    const row=list.length+k;
    if(e.a!==ref){ A[row][idx[e.a]]=cadd(A[row][idx[e.a]],C(1,0)); A[idx[e.a]][row]=cadd(A[idx[e.a]][row],C(1,0)); }
    if(e.b!==ref){ A[row][idx[e.b]]=csub(A[row][idx[e.b]],C(1,0)); A[idx[e.b]][row]=csub(A[idx[e.b]][row],C(1,0)); }
    b[row]=e.src;
  });
  for(let i=0;i<n;i++){
    let p=i; for(let r=i+1;r<n;r++) if(cabs(A[r][i])>cabs(A[p][i])) p=r;
    const ta=A[i]; A[i]=A[p]; A[p]=ta; const tb=b[i]; b[i]=b[p]; b[p]=tb;
    if(cabs(A[i][i])<1e-18) continue;
    for(let r=i+1;r<n;r++){
      const f=cdiv(A[r][i],A[i][i]);
      if(cabs(f)<1e-20) continue;
      for(let c=i;c<n;c++) A[r][c]=csub(A[r][c], cmul(f,A[i][c]));
      b[r]=csub(b[r], cmul(f,b[i]));
    }
  }
  const x=new Array(n).fill(null).map(()=>C(0,0));
  for(let i=n-1;i>=0;i--){
    if(cabs(A[i][i])<1e-18){ x[i]=C(0,0); continue; }
    let s=b[i]; for(let c=i+1;c<n;c++) s=csub(s, cmul(A[i][c],x[c]));
    x[i]=cdiv(s,A[i][i]);
  }
  const v={}; v[ref]=C(0,0);
  list.forEach((nd,i)=>v[nd]=x[i]);
  return {v:v, xa:x, base:list.length, nv:vs.length};
}

function Zbetween(net, tp, tn){
  const nodes={}; net.forEach(e=>{ nodes[e.a]=1; nodes[e.b]=1; }); nodes[tp]=1; nodes[tn]=1;
  const test=net.map(e=>({t:'Z',a:e.a,b:e.b,z:e.z})).concat([{t:'I',a:tn,b:tp,src:C(1,0)}]);
  const sol=solveC(nodes,test,tn);
  return csub(sol.v[tp]||C(0,0), sol.v[tn]||C(0,0));
}

function deactivate(els){
  const parent={};
  const find=k=>{ if(!(k in parent)) parent[k]=k;
    while(parent[k]!==k){ parent[k]=parent[parent[k]]; k=parent[k]; } return k; };
  const union=(a,b)=>{ const ra=find(a),rb=find(b); if(ra!==rb) parent[ra]=rb; };
  els.forEach(e=>{ find(e.a); find(e.b); if(e.t==='V') union(e.a,e.b); });
  const net=[];
  els.forEach(e=>{ if(e.t!=='V'&&e.t!=='I') net.push({a:find(e.a),b:find(e.b),z:e.z,name:e.name,members:[e.name]}); });
  return {net:net, find:find};
}

function reduce(net, tp, tn){
  net=net.map(e=>({a:e.a,b:e.b,z:e.z,expr:e.expr||e.name,members:e.members||[e.name]}));
  const steps=[];
  for(let g=0;g<60;g++){
    let done=false;
    for(let i=0;i<net.length&&!done;i++) for(let j=i+1;j<net.length&&!done;j++){
      const A=net[i],B=net[j];
      const same=(A.a===B.a&&A.b===B.b)||(A.a===B.b&&A.b===B.a);
      if(!same) continue;
      const Z=cdiv(cmul(A.z,B.z), cadd(A.z,B.z));
      const merged={a:A.a,b:A.b,z:Z,expr:'('+A.expr+'∥'+B.expr+')',members:A.members.concat(B.members)};
      const nn=net.filter((_,k)=>k!==i&&k!==j).concat([merged]);
      steps.push({title:A.expr+' ∥ '+B.expr+' = '+fz(Z), why:'같은 두 점 사이 → 병렬  Z = Z₁Z₂/(Z₁+Z₂)', net:nn});
      net=nn; done=true;
    }
    if(done) continue;
    const deg={}; net.forEach(e=>{ deg[e.a]=(deg[e.a]||0)+1; deg[e.b]=(deg[e.b]||0)+1; });
    for(const k of Object.keys(deg)){
      if(k===tp||k===tn||deg[k]!==2) continue;
      const inc=[]; net.forEach((e,i)=>{ if(e.a===k||e.b===k) inc.push(i); });
      const [i,j]=inc, A=net[i], B=net[j];
      const oa=A.a===k?A.b:A.a, ob=B.a===k?B.b:B.a;
      const Z=cadd(A.z,B.z);
      const merged={a:oa,b:ob,z:Z,expr:'('+A.expr+'+'+B.expr+')',members:A.members.concat(B.members)};
      const nn=net.filter((_,m)=>m!==i&&m!==j).concat([merged]);
      steps.push({title:A.expr+' + '+B.expr+' = '+fz(Z), why:'중간 점에 소자 둘만 → 직렬  Z = Z₁+Z₂', net:nn});
      net=nn; done=true; break;
    }
    if(done) continue;
    break;
  }
  return {net:net, steps:steps};
}

function resistorPath(x1,y1,x2,y2){
  const dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy)||1;
  const ux=dx/L, uy=dy/L, px=-uy, py=ux;
  const seg=Math.min(56,L*0.6), start=(L-seg)/2, n=6, amp=6;
  let d='M '+x1+' '+y1+' L '+(x1+ux*start)+' '+(y1+uy*start);
  for(let i=1;i<=n;i++){ const t=start+seg*i/n, off=(i%2?amp:-amp);
    d+=' L '+(x1+ux*t+px*off)+' '+(y1+uy*t+py*off); }
  d+=' L '+(x1+ux*(start+seg))+' '+(y1+uy*(start+seg))+' L '+x2+' '+y2;
  return d;
}
function coilPath(x1,y1,x2,y2){
  const dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy)||1;
  const ux=dx/L, uy=dy/L;
  const r=Math.min(13, L/6.5), s0=(L-6*r)/2;
  let d='M '+x1+' '+y1+' L '+(x1+ux*s0)+' '+(y1+uy*s0);
  for(let i=0;i<3;i++){
    const t1=s0+2*r*(i+1);
    d+=' A '+r+' '+r+' 0 0 1 '+(x1+ux*t1)+' '+(y1+uy*t1);
  }
  d+=' L '+x2+' '+y2;
  return d;
}

function labelBox(x,y,t,c){
  return '<rect x="'+(x-t.length*3.2-3)+'" y="'+(y-10)+'" width="'+(t.length*6.4+6)+'" height="14" fill="var(--bg)" opacity="0.9" rx="3"/>'+
         '<text x="'+x+'" y="'+y+'" fill="'+c+'" font-size="10" text-anchor="middle">'+t+'</text>';
}
function valText(e){
  if(e.type==='R') return (+e.val.toFixed(3))+'Ω';
  if(e.type==='L') return (+(e.val*1e3).toFixed(4))+'mH';
  if(e.type==='C') return (+(e.val*1e6).toFixed(4))+'µF';
  const ph=e.phase||0;
  return (+e.val.toFixed(3))+(e.type==='V'?'V':'A')+(ph?'∠'+ph+'°':'');
}

function drawAll(){
  ensureSvg();
  let s='';
  for(let i=0;i<=COLS;i++) s+='<line x1="'+gx(i)+'" y1="'+gy(0)+'" x2="'+gx(i)+'" y2="'+gy(ROWS)+'" stroke="var(--line)" stroke-width="0.5" opacity="0.55"/>';
  for(let j=0;j<=ROWS;j++) s+='<line x1="'+gx(0)+'" y1="'+gy(j)+'" x2="'+gx(COLS)+'" y2="'+gy(j)+'" stroke="var(--line)" stroke-width="0.5" opacity="0.55"/>';

  elements.forEach(e=>{
    const x1=gx(e.p1[0]), y1=gy(e.p1[1]), x2=gx(e.p2[0]), y2=gy(e.p2[1]);
    const isSel=sel&&sel.kind==='el'&&sel.id===e.id;
    const col=isSel?'var(--acc)':'var(--txt)';
    const label=e.name+' '+valText(e);
    const vert=Math.abs(x2-x1)<1;
    const mx=(x1+x2)/2, my=(y1+y2)/2;
    const ox=vert?-12:0, oy=vert?-18:-11;

    if(e.type==='W'){
      s+='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(isSel?'var(--acc)':'var(--wire)')+'" stroke-width="2.5"/>';
    } else if(e.type==='R'){
      s+='<path d="'+resistorPath(x1,y1,x2,y2)+'" fill="none" stroke="'+col+'" stroke-width="2"/>';
      s+=labelBox(mx+ox,my+oy,label,col);
    } else if(e.type==='L'){
      s+='<path d="'+coilPath(x1,y1,x2,y2)+'" fill="none" stroke="'+col+'" stroke-width="2"/>';
      s+=labelBox(mx+ox,my+oy,label,col);
    } else if(e.type==='C'){
      const dx=x2-x1, dy=y2-y1, L2=Math.hypot(dx,dy)||1;
      const ux=dx/L2, uy=dy/L2, px=-uy, py=ux;
      const gap=7, half=13;
      const p1=[mx-ux*gap/2, my-uy*gap/2], p2=[mx+ux*gap/2, my+uy*gap/2];
      s+='<line x1="'+x1+'" y1="'+y1+'" x2="'+p1[0]+'" y2="'+p1[1]+'" stroke="var(--wire)" stroke-width="2"/>';
      s+='<line x1="'+p2[0]+'" y1="'+p2[1]+'" x2="'+x2+'" y2="'+y2+'" stroke="var(--wire)" stroke-width="2"/>';
      s+='<line x1="'+(p1[0]-px*half)+'" y1="'+(p1[1]-py*half)+'" x2="'+(p1[0]+px*half)+'" y2="'+(p1[1]+py*half)+'" stroke="'+col+'" stroke-width="2.6"/>';
      s+='<line x1="'+(p2[0]-px*half)+'" y1="'+(p2[1]-py*half)+'" x2="'+(p2[0]+px*half)+'" y2="'+(p2[1]+py*half)+'" stroke="'+col+'" stroke-width="2.6"/>';
      s+=labelBox(mx+ox,my+oy,label,col);
    } else {
      const ux=(x2-x1)/(Math.hypot(x2-x1,y2-y1)||1), uy=(y2-y1)/(Math.hypot(x2-x1,y2-y1)||1);
      s+='<line x1="'+x1+'" y1="'+y1+'" x2="'+(mx-ux*18)+'" y2="'+(my-uy*18)+'" stroke="var(--wire)" stroke-width="2"/>';
      s+='<line x1="'+(mx+ux*18)+'" y1="'+(my+uy*18)+'" x2="'+x2+'" y2="'+y2+'" stroke="var(--wire)" stroke-width="2"/>';
      s+='<circle cx="'+mx+'" cy="'+my+'" r="16" fill="var(--bg)" stroke="'+col+'" stroke-width="2"/>';
      if(e.type==='V'){
        s+='<line x1="'+(mx-5)+'" y1="'+my+'" x2="'+(mx+5)+'" y2="'+my+'" stroke="'+col+'" stroke-width="1.5"/>';
        s+='<line x1="'+mx+'" y1="'+(my-5)+'" x2="'+mx+'" y2="'+(my+5)+'" stroke="'+col+'" stroke-width="1.5"/>';
        s+='<text x="'+(x1+ux*22)+'" y="'+(y1+uy*22+4)+'" fill="var(--warn)" font-size="11" font-weight="700">+</text>';
        s+='<text x="'+(x2-ux*22)+'" y="'+(y2-uy*22+4)+'" fill="var(--warn)" font-size="11" font-weight="700">−</text>';
      } else {
        s+='<line x1="'+mx+'" y1="'+(my+8)+'" x2="'+mx+'" y2="'+(my-8)+'" stroke="'+col+'" stroke-width="1.5"/>';
        s+='<path d="M '+(mx-4)+' '+(my-3)+' L '+mx+' '+(my-9)+' L '+(mx+4)+' '+(my-3)+' z" fill="'+col+'"/>';
      }
      s+=labelBox(mx,my+30,label,col);
    }
    s+='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="transparent" stroke-width="16" data-el="'+e.id+'" style="cursor:pointer"/>';
  });

  const pts={};
  elements.forEach(e=>{ pts[key(e.p1)]=e.p1; pts[key(e.p2)]=e.p2; });
  Object.keys(pts).forEach(k=>{
    const p=pts[k];
    const isA=termA&&key(termA)===k, isB=termB&&key(termB)===k;
    const isSel=sel&&sel.kind==='pt'&&key(sel.p)===k;
    s+='<circle cx="'+gx(p[0])+'" cy="'+gy(p[1])+'" r="4" fill="'+(isSel?'var(--acc)':'var(--txt)')+'"/>';
    if(isA||isB){
      s+='<circle cx="'+gx(p[0])+'" cy="'+gy(p[1])+'" r="9" fill="none" stroke="var(--warn)" stroke-width="2.5"/>';
      s+='<text x="'+(gx(p[0])+13)+'" y="'+(gy(p[1])-11)+'" fill="var(--warn)" font-size="12" font-weight="700">'+(isA?'A':'B')+'</text>';
    }
    s+='<circle cx="'+gx(p[0])+'" cy="'+gy(p[1])+'" r="14" fill="transparent" data-pt="'+k+'" style="cursor:crosshair"/>';
  });

  if(dragFrom&&dragTo){
    s+='<line x1="'+gx(dragFrom[0])+'" y1="'+gy(dragFrom[1])+'" x2="'+gx(dragTo[0])+'" y2="'+gy(dragTo[1])+
       '" stroke="var(--acc)" stroke-width="2" stroke-dasharray="6 4" opacity="0.85"/>';
  }
  document.getElementById('scene').innerHTML=s;
}

function ensureSvg(){
  if(document.getElementById('cv')) return;
  document.getElementById('canvasWrap').innerHTML=
    '<svg id="cv" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg"><g id="scene"></g></svg>';
  bindCanvas();
}

function snap(evt,svg){
  const r=svg.getBoundingClientRect();
  const x=(evt.clientX-r.left)/r.width*W, y=(evt.clientY-r.top)/r.height*H;
  const i=Math.round((x-MARGIN)/STEP), j=Math.round((y-MARGIN)/STEP);
  if(i<0||j<0||i>COLS||j>ROWS) return null;
  if(Math.hypot(x-gx(i),y-gy(j))>STEP*0.62) return null;
  return [i,j];
}

function bindCanvas(){
  const svg=document.getElementById('cv');
  let dragging=false;
  svg.addEventListener('pointerdown',e=>{
    const t=e.target;
    if(t.dataset&&t.dataset.el){ sel={kind:'el', id:parseInt(t.dataset.el,10)}; renderSel(); drawAll(); return; }
    const p=snap(e,svg);
    if(p){ dragging=true; dragFrom=p; dragTo=p; try{ svg.setPointerCapture(e.pointerId); }catch(err){} drawAll(); }
  });
  svg.addEventListener('pointermove',e=>{
    if(!dragging) return;
    const p=snap(e,svg);
    if(p && (p[0]!==dragTo[0]||p[1]!==dragTo[1])){ dragTo=p; drawAll(); }
  });
  const onUp=e=>{
    if(!dragging) return;
    dragging=false;
    const p=snap(e,svg);
    const from=dragFrom; dragFrom=null; dragTo=null;
    if(p){
      const same=(p[0]===from[0]&&p[1]===from[1]);
      if(same){ sel={kind:'pt', p:from}; renderSel(); drawAll(); return; }
      const horizontal=p[1]===from[1], vertical=p[0]===from[0];
      if(!horizontal&&!vertical){ flash('가로나 세로로만 연결할 수 있습니다.'); drawAll(); return; }
      addElement(tool, from, p);
    }
    drawAll();
  };
  svg.addEventListener('pointerup',onUp);
  svg.addEventListener('pointercancel',onUp);
  window.addEventListener('pointerup',e=>{ if(dragging) onUp(e); });
}

let flashMsg='';
function flash(m){ flashMsg=m; document.getElementById('warnLine').textContent=m;
  setTimeout(()=>{ if(flashMsg===m){ flashMsg=''; document.getElementById('warnLine').textContent=''; } },4000); }

function addElement(type,p1,p2){
  let raw=parseFloat(document.getElementById('valIn').value);
  if(!isFinite(raw)) raw=10;
  let val=raw;
  if(type==='L') val=raw*1e-3;
  if(type==='C') val=raw*1e-6;
  if(type==='W') val=0;
  const phase=(type==='V'||type==='I') ? (parseFloat(document.getElementById('phIn').value)||0) : 0;
  const name=({R:'R',L:'L',C:'C',V:'V',I:'I',W:'W'})[type]+(seq++);
  elements.push({id:seq, type:type, p1:p1, p2:p2, val:val, phase:phase, name:name});
  sel={kind:'el', id:seq};
  renderSel(); compute();
}

function renderSel(){
  const si=document.getElementById('selInfo');
  if(!sel){ si.innerHTML='선택 없음'; return; }
  if(sel.kind==='pt'){ si.innerHTML='점 ('+sel.p[0]+', '+sel.p[1]+') 선택 — A/B 단자로 지정할 수 있습니다.'; return; }
  const e=elements.find(x=>x.id===sel.id);
  if(!e){ si.innerHTML='선택 없음'; return; }
  let unit='', disp=e.val;
  if(e.type==='R'){ unit='Ω'; }
  else if(e.type==='L'){ unit='mH'; disp=e.val*1e3; }
  else if(e.type==='C'){ unit='µF'; disp=e.val*1e6; }
  else if(e.type==='V'){ unit='V'; }
  else if(e.type==='I'){ unit='A'; }
  si.innerHTML='<b>'+e.name+'</b> 선택 ('+e.type+') — 값 수정 시 즉시 재계산. '+
    (e.type!=='W' ? '<input id="selVal" type="number" step="any" value="'+disp+'" style="width:90px;margin-left:6px"> '+unit : '')+
    ((e.type==='V'||e.type==='I') ? ' <input id="selPh" type="number" step="any" value="'+(e.phase||0)+'" style="width:70px"> °' : '');
  const inp=document.getElementById('selVal');
  if(inp) inp.addEventListener('input',()=>{
    const v=parseFloat(inp.value);
    if(!isFinite(v)) return;
    e.val = e.type==='L'? v*1e-3 : e.type==='C'? v*1e-6 : v;
    compute(); drawAll();
  });
  const ip=document.getElementById('selPh');
  if(ip) ip.addEventListener('input',()=>{
    const v=parseFloat(ip.value); if(isFinite(v)){ e.phase=v; compute(); drawAll(); }
  });
}

function compute(){
  const rr=resolved(elements);
  const A=rr.els, map=rr.map;
  const res=document.getElementById('results');
  const steps=document.getElementById('stepsPanel');
  const chk=document.getElementById('checks');

  fHz=parseFloat(document.getElementById('freq').value); if(!isFinite(fHz)||fHz<0) fHz=0;

  const kA=termA?key(termA):null, kB=termB?key(termB):null;
  const nA=kA?(map[kA]||kA):null, nB=kB?(map[kB]||kB):null;

  if(!nA||!nB||nA===nB){
    res.innerHTML='<div class="v"><div class="k">상태</div><div class="n">A·B 단자를 먼저 지정하세요</div>'+
      '<div class="u">서로 다른 두 점을 A, B로 지정해야 계산됩니다</div></div>';
    steps.innerHTML=''; chk.innerHTML=''; save(); return;
  }
  if(!A.length){ res.innerHTML=''; steps.innerHTML=''; chk.innerHTML=''; save(); return; }

  const nodes={}; A.forEach(e=>{ nodes[e.a]=1; nodes[e.b]=1; }); nodes[nA]=1; nodes[nB]=1;

  const sol=solveC(nodes, A, nB);
  const Voc=csub(sol.v[nA]||C(0,0), sol.v[nB]||C(0,0));

  const withShort=A.concat([{t:'V',a:nA,b:nB,src:C(0,0)}]);
  const sol2=solveC(nodes, withShort, nB);
  const Isc=sol2.xa[sol2.base + (withShort.filter(e=>e.t==='V').length-1)] || C(0,0);

  const Zth = cabs(Isc)>1e-15 ? cdiv(Voc,Isc) : C(NaN,0);

  const d=deactivate(A);
  const red=reduce(d.net, d.find(nA), d.find(nB));

  const IN=cdiv(Voc,Zth);
  res.innerHTML=[
    ['V_th', fz(Voc), fzR(Voc), true],
    ['Z_th', fz(Zth), fzR(Zth), true],
    ['I_N = V_th / Z_th', fz(IN), fzR(IN), false],
    ['I_sc (단락전류)', fz(Isc), fzR(Isc), false],
    ['최대전력 전달 Z_L', fz(C(Zth.re,-Zth.im)), 'Z_th 의 켤레', false],
    ['주파수', (fHz>0? fmt(fHz,0)+' Hz' : '직류 (0 Hz)'), '', false]
  ].map(x=>'<div class="v'+(x[3]?' hi':'')+'"><div class="k">'+x[0]+'</div><div class="n">'+x[1]+
    '</div><div class="u">'+x[2]+'</div></div>').join('');

  let sh='';
  red.steps.forEach((st,i)=>{
    let running='';
    try{ const z=Zbetween(st.net, d.find(nA), d.find(nB));
      running='이 단계 후 Z = '+fz(z)+(cabs(csub(z,Zth))<1e-6*Math.max(1,cabs(Zth))?'  ✓ 유지':'  ⚠ 변함');
    }catch(e){ running='계산 불가'; }
    sh+='<div class="step"><div class="fh">'+(i+1)+'. '+st.title+'</div>'+
        '<div class="why">'+st.why+'</div><div class="why" style="color:var(--txt)">'+running+'</div></div>';
  });
  if(!red.steps.length) sh='<div class="why">이미 단순한 회로이거나, 직병렬로 줄일 수 없는 구조입니다.</div>';
  steps.innerHTML=sh;

  const same = cabs(Isc)>1e-15 && cabs(Voc)>1e-15 && cabs(csub(cdiv(Voc,Isc), Zth))<1e-9*Math.max(1,cabs(Zth));
  const redOK = red.net.length===1 && cabs(csub(red.net[0].z,Zth))<1e-6*Math.max(1,cabs(Zth));
  chk.innerHTML=[
    ['Z_th = V_th / I_sc', !!same, fz(cdiv(Voc,Isc))+' vs '+fz(Zth)],
    ['단계 축소가 Z_th와 일치', redOK, red.net.length===1? fz(red.net[0].z):'남은 소자 '+red.net.length+'개'],
    ['A/B 단자 서로 다름', nA!==nB, '정상']
  ].map(c=>'<div class="chk"><span>'+c[0]+'</span><b class="'+(c[1]?'ok':'bad')+'">'+
    (c[1]?'✓ ':'! ')+c[2]+'</b></div>').join('');

  document.getElementById('warnLine').textContent = (fHz===0) ? '직류 모드: 코일은 단락, 콘덴서는 개방으로 계산합니다.' : '';
  save();
}

function save(){
  try{ localStorage.setItem('ckt-ac-v1', JSON.stringify({elements:elements,termA:termA,termB:termB,seq:seq,f:fHz})); }catch(e){}
}

document.querySelectorAll('[data-tool]').forEach(b=>{
  b.addEventListener('click',()=>{
    tool=b.dataset.tool;
    document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('on',x===b));
    document.getElementById('unitLbl').textContent={R:'Ω',L:'mH',C:'µF',V:'V',I:'A',W:'—'}[tool];
    document.getElementById('phaseWrap').style.display=(tool==='V'||tool==='I')?'inline':'none';
  });
});
document.getElementById('setA').addEventListener('click',()=>{ if(sel&&sel.kind==='pt'){ termA=sel.p; compute(); drawAll(); } else flash('먼저 점을 선택하세요.'); });
document.getElementById('setB').addEventListener('click',()=>{ if(sel&&sel.kind==='pt'){ termB=sel.p; compute(); drawAll(); } else flash('먼저 점을 선택하세요.'); });
document.getElementById('flip').addEventListener('click',()=>{
  if(sel&&sel.kind==='el'){ const e=elements.find(x=>x.id===sel.id); if(e){ const t=e.p1; e.p1=e.p2; e.p2=t; compute(); drawAll(); } }
  else flash('소자를 먼저 선택하세요.');
});
document.getElementById('delSel').addEventListener('click',()=>{
  if(sel&&sel.kind==='el'){ elements=elements.filter(x=>x.id!==sel.id); sel=null; renderSel(); compute(); drawAll(); }
});
document.getElementById('clearAll').addEventListener('click',()=>{
  elements=[]; sel=null; termA=null; termB=null; seq=1; renderSel(); compute(); drawAll();
});
document.getElementById('freq').addEventListener('input',()=>{ compute(); drawAll(); });
document.addEventListener('keydown',e=>{
  if(e.key==='Delete'&&sel&&sel.kind==='el'){ elements=elements.filter(x=>x.id!==sel.id); sel=null; renderSel(); compute(); drawAll(); }
});

function loadSample(n){
  elements=[]; sel=null; seq=1;
  const mk=(type,p1,p2,val,name,phase)=>{ elements.push({id:seq++,type:type,p1:p1,p2:p2,val:val,phase:phase||0,name:name}); };
  if(n===1){
    document.getElementById('freq').value=1000;
    mk('V',[0,0],[0,5],10,'V1',0);
    mk('R',[0,0],[6,0],1000,'R1');
    mk('C',[6,0],[6,5],100e-9,'C1');
    mk('W',[0,5],[12,5],0,'W1');
    termA=[6,0]; termB=[12,5];
  } else if(n===2){
    document.getElementById('freq').value=5000;
    mk('V',[0,0],[0,4],5,'V1',30);
    mk('R',[0,0],[4,0],10,'R1');
    mk('L',[4,0],[8,0],10e-3,'L1');
    mk('C',[8,0],[8,4],1e-6,'C1');
    mk('W',[0,4],[12,4],0,'W1');
    termA=[8,0]; termB=[12,4];
  } else {
    document.getElementById('freq').value=0;
    mk('V',[0,0],[0,5],12,'V1',0);
    mk('R',[0,0],[6,0],4,'R1');
    mk('R',[6,0],[6,5],6,'R2');
    mk('R',[6,0],[12,0],3,'R3');
    mk('W',[0,5],[12,5],0,'W1');
    termA=[12,0]; termB=[12,5];
  }
  fHz=parseFloat(document.getElementById('freq').value)||0;
  compute(); drawAll(); renderSel();
}
document.getElementById('load1').addEventListener('click',()=>loadSample(1));
document.getElementById('load2').addEventListener('click',()=>loadSample(2));
document.getElementById('load3').addEventListener('click',()=>loadSample(3));

(function init(){
  try{
    const raw=localStorage.getItem('ckt-ac-v1');
    if(raw){ const o=JSON.parse(raw);
      if(o&&o.elements&&o.elements.length){ elements=o.elements; termA=o.termA; termB=o.termB; seq=o.seq||1;
        if(o.f!==undefined) document.getElementById('freq').value=o.f; } }
  }catch(e){}
  fHz=parseFloat(document.getElementById('freq').value)||0;
  if(!elements.length) loadSample(1);
  renderSel(); compute(); drawAll();
})();
</script>
