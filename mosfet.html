<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOSFET 동작 영역 · I-V · 채널 밴드</title>
<style>
  :root{ --bg:#0f1216; --panel:#161b22; --line:#2a323d; --txt:#e6edf3; --dim:#9aa7b4;
         --acc:#58a6ff; --warn:#f0883e; --ok:#3fb950; --red:#f85149; --pur:#bc8cff; --wire:#8b949e; --ec:#58a6ff; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
       padding:16px 14px 40px;-webkit-text-size-adjust:100%}
  h1{font-size:19px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
  .grid{display:grid;gap:9px}
  .fld{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 9px}
  .fld label{display:block;font-size:11px;color:var(--dim);margin-bottom:2px}
  .fld input,.fld select{width:100%;background:transparent;border:0;color:var(--txt);
        font:inherit;font-size:14px;outline:none;padding:0}
  .sec{font-size:12px;color:var(--dim);margin:2px 0 6px;letter-spacing:.02em}
  svg{width:100%;max-width:940px;height:auto;display:block;margin:0 auto;background:var(--bg);border-radius:8px}
  .regime{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .pill{font-size:15px;font-weight:700;padding:6px 14px;border-radius:999px;border:1px solid}
  .pill.cut{color:#8b949e;border-color:#8b949e}
  .pill.tri{color:#58a6ff;border-color:#58a6ff}
  .pill.sat{color:#f85149;border-color:#f85149}
  .vals{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:9px}
  .v{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px}
  .v .k{font-size:11px;color:var(--dim)} .v .n{font-size:16px;font-variant-numeric:tabular-nums}
  .v .u{font-size:11px;color:var(--dim)}
  .v.hi{border-color:var(--acc)}
  .chk{font-size:12.5px;display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dashed var(--line)}
  .chk:last-child{border-bottom:0}
  .ok{color:var(--ok)} .bad{color:var(--warn)}
  .note{font-size:12.5px;color:var(--dim);margin-top:8px}
  .note b{color:var(--txt)}
</style>
</head>
<body>

<h1>MOSFET (n-channel) 동작 영역 · I-V · 채널 밴드</h1>
<div class="sub">컷오프 / 선형 / 포화 판정 · 출력·전달 특성 · 핀치오프까지의 채널 에너지</div>

<div class="card">
  <div class="sec">동작점</div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr))">
    <div class="fld"><label>V_GS (V)</label><input id="vgs" type="number" step="0.01" value="2.0"></div>
    <div class="fld"><label>V_DS (V)</label><input id="vds" type="number" step="0.01" value="2.0"></div>
    <div class="fld"><label>V_BS (V) · 몸체</label><input id="vbs" type="number" step="0.01" value="0"></div>
  </div>
  <div class="sec" style="margin-top:10px">소자 파라미터</div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr))">
    <div class="fld"><label>V_T0 (V)</label><input id="vt0" type="number" step="0.01" value="0.70"></div>
    <div class="fld"><label>γ (√V)</label><input id="gam" type="number" step="0.01" value="0.50"></div>
    <div class="fld"><label>2φ_F (V)</label><input id="phi2" type="number" step="0.01" value="0.60"></div>
    <div class="fld"><label>k_n′ (µA/V²)</label><input id="kn" type="number" step="1" value="120"></div>
    <div class="fld"><label>W/L</label><input id="wl" type="number" step="0.1" value="10"></div>
    <div class="fld"><label>λ (1/V)</label><input id="lam" type="number" step="0.001" value="0.020"></div>
  </div>
</div>

<div class="card">
  <div class="regime">
    <span id="pill" class="pill cut">—</span>
    <span class="note" id="why" style="margin:0"></span>
  </div>
  <div class="vals" id="vals"></div>
</div>

<div class="card">
  <div style="font-size:13px;font-weight:600;margin-bottom:8px">출력 특성 I_D – V_DS</div>
  <div id="outPanel"></div>
  <div class="note" id="outNote"></div>
</div>

<div class="card">
  <div style="font-size:13px;font-weight:600;margin-bottom:8px">전달 특성 I_D – V_GS (V_DS 고정)</div>
  <div id="trPanel"></div>
</div>

<div class="card">
  <div style="font-size:13px;font-weight:600;margin-bottom:8px">채널 에너지 다이어그램 (source → drain)</div>
  <div id="bandPanel"></div>
  <div class="note" id="bandNote"></div>
</div>

<div class="card">
  <div style="font-size:13px;font-weight:600;margin-bottom:8px">검산</div>
  <div id="checks"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const fmt=(v,d)=>{ d=(d===undefined)?3:d;
  return v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}); };
const eng=v=>{ const a=Math.abs(v);
  if(a===0) return '0';
  const SUP={'-':'\u207B','0':'\u2070','1':'\u00B9','2':'\u00B2','3':'\u00B3','4':'\u2074','5':'\u2075','6':'\u2076','7':'\u2077','8':'\u2078','9':'\u2079'};
  if(a>=1e4||a<1e-2){ const e=Math.floor(Math.log10(a));
    return (v/Math.pow(10,e)).toFixed(3)+'\u00D710'+String(e).split('').map(c=>SUP[c]||c).join(''); }
  return String(+v.toPrecision(4)); };

function P(){
  return {
    vgs:parseFloat($('vgs').value)||0, vds:parseFloat($('vds').value)||0, vbs:parseFloat($('vbs').value)||0,
    vt0:parseFloat($('vt0').value)||0, gam:parseFloat($('gam').value)||0, phi2:parseFloat($('phi2').value)||0,
    kn:(parseFloat($('kn').value)||0)*1e-6, wl:parseFloat($('wl').value)||0,
    lam:parseFloat($('lam').value)||0
  };
}
const beta=p=>p.kn*p.wl;
const vth=(p,vbs)=>{ const sb=Math.max(0,-vbs);
  return p.vt0 + p.gam*(Math.sqrt(p.phi2+sb)-Math.sqrt(p.phi2)); };

function drain(p,vgs,vds,vbs){
  const vt=vth(p,vbs||0), vov=vgs-vt, b=beta(p);
  if(vov<=0) return {i:0, reg:'cut', vt:vt, vov:vov};
  if(vds<vov){
    const i=b*(vov*vds-0.5*vds*vds)*(1+p.lam*vds);
    return {i:i, reg:'tri', vt:vt, vov:vov};
  }
  const i=0.5*b*vov*vov*(1+p.lam*vds);
  return {i:i, reg:'sat', vt:vt, vov:vov};
}

/* ---------- 출력 특성 ---------- */
function drawOut(p,r){
  const W=940,H=420,padL=78,padR=26,padT=26,padB=56;
  const pw=W-padL-padR, ph=H-padT-padB;
  const vdsMax=Math.max(1.5, Math.max(p.vds*1.6, (vth(p,p.vbs)+1.2)*1.6));
  const gsList=[];
  for(let k=1;k<=4;k++) gsList.push(vth(p,p.vbs)+0.3*k);
  if(!gsList.some(g=>Math.abs(g-p.vgs)<1e-9)) gsList.push(p.vgs);
  gsList.sort((a,b)=>a-b);
  let imax=1e-12;
  gsList.forEach(g=>{ for(let i=0;i<=120;i++){ const v=vdsMax*i/120;
    const d=drain(p,g,v,p.vbs); if(d.i>imax) imax=d.i; } });
  imax*=1.12;

  const X=v=>padL+v/vdsMax*pw;
  const Y=i=>padT+ph-i/imax*ph;
  const T=(x,y,t,c,s,a,w)=>'<text x="'+x+'" y="'+y+'" fill="'+(c||'var(--dim)')+'" font-size="'+(s||11)+
    '" font-weight="'+(w||400)+'" text-anchor="'+(a||'start')+'">'+t+'</text>';

  let s='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="출력 특성">';
  s+='<rect x="'+padL+'" y="'+padT+'" width="'+pw+'" height="'+ph+'" fill="none" stroke="var(--line)"/>';

  // 포화 경계 (V_DS = V_ov)
  let bnd=[];
  for(let i=0;i<=80;i++){
    const g=vth(p,p.vbs)+(gsList[gsList.length-1]-vth(p,p.vbs))*i/80;
    const vov=g-vth(p,p.vbs); if(vov<=0) continue;
    const vds=vov, d=drain(p,g,vds,p.vbs);
    if(vds<=vdsMax) bnd.push(X(vds)+','+Y(d.i));
  }
  if(bnd.length){
    s+='<polyline points="'+bnd.join(' ')+'" fill="none" stroke="var(--red)" stroke-width="1.4" stroke-dasharray="6 5" opacity="0.85"/>';
    const last=bnd[bnd.length-1].split(',');
    s+=T(+last[0]+6,+last[1]-6,'포화 경계 V_DS = V_ov','var(--red)',10.5,'start',600);
  }

  // 곡선
  gsList.forEach(g=>{
    const cur=Math.abs(g-p.vgs)<1e-9;
    let pts=[];
    for(let i=0;i<=140;i++){ const v=vdsMax*i/140; const d=drain(p,g,v,p.vbs);
      pts.push(X(v)+','+Y(d.i)); }
    s+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+(cur?'var(--acc)':'var(--wire)')+
       '" stroke-width="'+(cur?2.6:1.4)+'" opacity="'+(cur?1:0.75)+'"/>';
    const dEnd=drain(p,g,vdsMax,p.vbs);
    s+=T(padL+pw-6,Y(dEnd.i)-6,'V_GS='+fmt(g,2),cur?'var(--acc)':'var(--dim)',10,'end');
  });

  // 동작점
  const dx=X(p.vds), dy=Y(r.i);
  s+='<line x1="'+dx+'" y1="'+(padT+ph)+'" x2="'+dx+'" y2="'+dy+'" stroke="var(--warn)" stroke-width="1" stroke-dasharray="3 3"/>';
  s+='<line x1="'+padL+'" y1="'+dy+'" x2="'+dx+'" y2="'+dy+'" stroke="var(--warn)" stroke-width="1" stroke-dasharray="3 3"/>';
  s+='<circle cx="'+dx+'" cy="'+dy+'" r="5.5" fill="var(--warn)" stroke="var(--bg)" stroke-width="2"/>';

  // 축
  [0,0.25,0.5,0.75,1].forEach(f=>{
    s+=T(padL+f*pw,padT+ph+18,fmt(vdsMax*f,2),'var(--dim)',10,'middle');
  });
  s+=T(padL+pw/2,padT+ph+40,'V_DS (V)','var(--dim)',11,'middle');
  [0,0.25,0.5,0.75,1].forEach(f=>{
    s+=T(padL-8,Y(imax*f)+4,eng(imax*f),'var(--dim)',10,'end');
    s+='<line x1="'+padL+'" y1="'+Y(imax*f)+'" x2="'+(padL-5)+'" y2="'+Y(imax*f)+'" stroke="var(--line)"/>';
  });
  s+=T(padL-8,padT-8,'I_D (A)','var(--dim)',10,'end');
  s+='</svg>';
  return s;
}

/* ---------- 전달 특성 ---------- */
function drawTr(p,r){
  const W=940,H=340,padL=78,padR=26,padT=24,padB=52;
  const pw=W-padL-padR, ph=H-padT-padB;
  const gsMax=Math.max(p.vgs*1.3, vth(p,p.vbs)+2.0);
  let imax=1e-12;
  for(let i=0;i<=140;i++){ const g=gsMax*i/140; const d=drain(p,g,p.vds,p.vbs); if(d.i>imax) imax=d.i; }
  imax*=1.15;
  const X=g=>padL+g/gsMax*pw;
  const Y=i=>padT+ph-i/imax*ph;
  const T=(x,y,t,c,s,a,w)=>'<text x="'+x+'" y="'+y+'" fill="'+(c||'var(--dim)')+'" font-size="'+(s||11)+
    '" font-weight="'+(w||400)+'" text-anchor="'+(a||'start')+'">'+t+'</text>';

  let s='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="전달 특성">';
  s+='<rect x="'+padL+'" y="'+padT+'" width="'+pw+'" height="'+ph+'" fill="none" stroke="var(--line)"/>';
  let pts=[];
  for(let i=0;i<=160;i++){ const g=gsMax*i/160; const d=drain(p,g,p.vds,p.vbs); pts.push(X(g)+','+Y(d.i)); }
  s+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="var(--acc)" stroke-width="2.4"/>';

  const vt=vth(p,p.vbs);
  s+='<line x1="'+X(vt)+'" y1="'+padT+'" x2="'+X(vt)+'" y2="'+(padT+ph)+'" stroke="var(--red)" stroke-width="1" stroke-dasharray="4 4"/>';
  s+=T(X(vt)+5,padT+14,'V_T = '+fmt(vt,3)+' V','var(--red)',10.5,'start',600);

  const dx=X(p.vgs), dy=Y(r.i);
  s+='<circle cx="'+dx+'" cy="'+dy+'" r="5.5" fill="var(--warn)" stroke="var(--bg)" stroke-width="2"/>';
  s+=T(dx+9,dy-8,'I_D = '+eng(r.i)+' A','var(--warn)',10.5,'start',600);

  [0,0.25,0.5,0.75,1].forEach(f=>{ s+=T(padL+f*pw,padT+ph+18,fmt(gsMax*f,2),'var(--dim)',10,'middle'); });
  s+=T(padL+pw/2,padT+ph+38,'V_GS (V)','var(--dim)',11,'middle');
  [0,0.5,1].forEach(f=>{ s+=T(padL-8,Y(imax*f)+4,eng(imax*f),'var(--dim)',10,'end'); });
  s+=T(padL-8,padT-6,'I_D (A)','var(--dim)',10,'end');
  s+='</svg>';
  return s;
}

/* ---------- 채널 밴드 ---------- */
var CHAN_NOTE='';
function drawChan(p,r){
  const W=940,H=300,padL=70,padR=30,padT=30,padB=60;
  const pw=W-padL-padR, ph=H-padT-padB;
  const X=f=>padL+f*pw;
  const emax=Math.max(p.vds, Math.max(r.vov,0))*1.25+0.15;
  const Y=e=>padT+ph-e/emax*ph;
  const T=(x,y,t,c,s,a,w)=>'<text x="'+x+'" y="'+y+'" fill="'+(c||'var(--dim)')+'" font-size="'+(s||11)+
    '" font-weight="'+(w||400)+'" text-anchor="'+(a||'start')+'">'+t+'</text>';

  let s='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="채널 에너지">';
  s+='<rect x="'+padL+'" y="'+padT+'" width="'+pw+'" height="'+ph+'" fill="none" stroke="var(--line)"/>';

  let note=''; CHAN_NOTE='';
  if(r.reg==='cut'){
    s+='<line x1="'+X(0)+'" y1="'+Y(0)+'" x2="'+X(1)+'" y2="'+Y(0)+'" stroke="var(--dim)" stroke-width="1.6" stroke-dasharray="5 4"/>';
    s+=T(padL+16,padT+22,'채널이 형성되지 않음 (V_GS < V_T)','var(--dim)',11.5,'start',600);
    note='컷오프에서는 표면에 반전층이 생기지 않아 E_c가 평평한 상태로 남습니다.'; CHAN_NOTE=note;
  } else if(r.reg==='tri'){
    s+='<line x1="'+X(0)+'" y1="'+Y(0)+'" x2="'+X(1)+'" y2="'+Y(p.vds)+'" stroke="var(--ec)" stroke-width="2.6"/>';
    s+='<line x1="'+X(0)+'" y1="'+Y(0)+'" x2="'+X(1)+'" y2="'+Y(0)+'" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 3"/>';
    s+=T(X(0.5),Y(p.vds/2)-10,'qV_DS = '+fmt(p.vds,2)+' eV','var(--ec)',11,'middle',600);
    note='선형 영역: 채널이 끝까지 이어지고 전위가 V_DS까지 선형으로 올라갑니다.'; CHAN_NOTE=note;
  } else {
    const xp=0.86;
    s+='<line x1="'+X(0)+'" y1="'+Y(0)+'" x2="'+X(xp)+'" y2="'+Y(r.vov)+'" stroke="var(--ec)" stroke-width="2.6"/>';
    s+='<line x1="'+X(xp)+'" y1="'+Y(r.vov)+'" x2="'+X(1)+'" y2="'+Y(p.vds)+'" stroke="var(--ec)" stroke-width="2.6" stroke-dasharray="5 4"/>';
    s+='<line x1="'+X(xp)+'" y1="'+padT+'" x2="'+X(xp)+'" y2="'+(padT+ph)+'" stroke="var(--red)" stroke-width="1" stroke-dasharray="4 4"/>';
    s+=T(X(xp)+6,padT+18,'핀치오프','var(--red)',10.5,'start',600);
    s+=T(X(0.45),Y(r.vov/2)-10,'qV_ov = '+fmt(r.vov,2)+' eV','var(--ec)',11,'middle',600);
    s+=T(X(0.95),Y(p.vds)-10,'V_DS','var(--warn)',10.5,'end',600);
    note='포화 영역: 채널 끝에서 전위가 V_ov에서 멈추고(핀치오프), 남은 V_DS − V_ov는 '+
      '드레인 쪽 공핍영역에 걸립니다. 핀치오프 위치는 개략 표시입니다.'; CHAN_NOTE=note;
  }

  s+='<line x1="'+padL+'" y1="'+Y(0)+'" x2="'+(padL+pw)+'" y2="'+Y(0)+'" stroke="var(--line)" stroke-width="0.8"/>';
  s+=T(padL-8,Y(0)+4,'0','var(--dim)',10,'end');
  s+=T(padL+4,padT-8,'E_c (eV)','var(--dim)',10,'start');
  s+=T(X(0),padT+ph+18,'source','var(--dim)',10.5,'middle');
  s+=T(X(1),padT+ph+18,'drain','var(--dim)',10.5,'middle');
  s+=T(padL+pw/2,padT+ph+40,'채널 위치','var(--dim)',11,'middle');
  s+='</svg>';
  return s;
}

/* ---------- 렌더 ---------- */
function render(){
  const p=P();
  const r=drain(p,p.vgs,p.vds,p.vbs);
  const regName={cut:'컷오프 (cut-off)',tri:'선형 (triode)',sat:'포화 (saturation)'}[r.reg];
  const pill=$('pill');
  pill.className='pill '+(r.reg==='cut'?'cut':r.reg==='tri'?'tri':'sat');
  pill.textContent=regName;
  $('why').textContent = r.reg==='cut'
    ? 'V_GS('+fmt(p.vgs,2)+' V) < V_T('+fmt(r.vt,3)+' V) → 채널 없음'
    : 'V_ov = '+fmt(r.vov,3)+' V , V_DS = '+fmt(p.vds,3)+' V → '+
      (p.vds < r.vov ? 'V_DS < V_ov 이므로 선형' : 'V_DS ≥ V_ov 이므로 포화');

  // 소신호
  const b=beta(p);
  const gm = r.reg==='tri' ? b*p.vds*(1+p.lam*p.vds) : (r.reg==='sat' ? b*r.vov*(1+p.lam*p.vds) : 0);
  const h=1e-6;
  const gmN=(drain(p,p.vgs+h,p.vds,p.vbs).i - drain(p,p.vgs-h,p.vds,p.vbs).i)/(2*h);
  const ro = (r.reg==='sat' && r.i>0) ? (1+p.lam*p.vds)/(p.lam*r.i) : Infinity;
  const ht=1e-5;
  const dIdV=(drain(p,p.vgs,p.vds+ht,p.vbs).i - drain(p,p.vgs,p.vds-ht,p.vbs).i)/(2*ht);
  const roN = dIdV>1e-15 ? 1/dIdV : Infinity;

  $('vals').innerHTML=[
    ['V_T',fmt(r.vt,4),'V',false],
    ['V_ov = V_GS − V_T',fmt(r.vov,4),'V',false],
    ['I_D',eng(r.i),'A',true],
    ['g_m',eng(gm),'A/V',false],
    ['r_o',r.reg==='sat'?eng(ro):'—',r.reg==='sat'?'Ω':'포화에서만',false],
    ['β = k′·W/L',eng(b),'A/V²',false]
  ].map(x=>'<div class="v'+(x[3]?' hi':'')+'"><div class="k">'+x[0]+'</div><div class="n">'+x[1]+
    '</div><div class="u">'+x[2]+'</div></div>').join('');

  $('outPanel').innerHTML=drawOut(p,r);
  $('outNote').innerHTML='빨간 점선이 <b>포화 경계 (V_DS = V_ov)</b>입니다. 그 왼쪽이 선형, 오른쪽이 포화. '+
    'V_GS가 커질수록 경계가 오른쪽 위로 이동합니다.';
  $('trPanel').innerHTML=drawTr(p,r);
  $('bandPanel').innerHTML=drawChan(p,r);
  $('bandNote').innerHTML=CHAN_NOTE;

  // 검산
  const vt=vth(p,p.vbs);
  const vov=p.vgs-vt;
  let cont='—', contOK=true;
  if(vov>0){
    const iL=b*(vov*vov-0.5*vov*vov)*(1+p.lam*vov);
    const iS=0.5*b*vov*vov*(1+p.lam*vov);
    cont=eng(iL)+' vs '+eng(iS);
    contOK=Math.abs(iL-iS)<1e-12*Math.max(1,Math.abs(iL));
  }
  const chk=[
    ['경계 연속성: I_D(선형)=I_D(포화) at V_DS=V_ov', contOK, cont],
    ['g_m 해석값 = 수치 미분', r.reg!=='cut' && Math.abs(gm-gmN)<1e-6*Math.max(1,Math.abs(gm)),
      eng(gm)+' vs '+eng(gmN)],
    ['r_o 해석값 = 수치 미분', !isFinite(ro) || Math.abs(ro-roN)/ro<1e-4,
      isFinite(ro)?eng(ro)+' vs '+eng(roN):'포화 아님'],
    ['V_T 몸체효과: V_BS=0 → V_T0', p.vbs!==0 || Math.abs(vt-p.vt0)<1e-12, fmt(vt,4)+' V']
  ];
  $('checks').innerHTML=chk.map(c=>'<div class="chk"><span>'+c[0]+'</span><b class="'+(c[1]?'ok':'bad')+'">'+
    (c[1]?'✓ ':'! ')+c[2]+'</b></div>').join('');
}

['vgs','vds','vbs','vt0','gam','phi2','kn','wl','lam'].forEach(id=>$(id).addEventListener('input',render));
render();
</script>
</body>
</html>
