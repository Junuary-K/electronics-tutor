<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가우스 법칙 — 대칭으로 전계 구하기</title>
<style>
  :root{ --bg:#0f1216; --panel:#161b22; --line:#2a323d; --txt:#e6edf3; --dim:#9aa7b4;
         --acc:#58a6ff; --warn:#f0883e; --ok:#3fb950; --red:#f85149; --pur:#bc8cff; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
       padding:16px 14px 40px;-webkit-text-size-adjust:100%}
  h1{font-size:19px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
  .grid{display:grid;gap:9px}
  .fld{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 9px}
  .fld label{display:block;font-size:11px;color:var(--dim);margin-bottom:2px}
  .fld input,.fld select{width:100%;background:transparent;border:0;color:var(--txt);font:inherit;font-size:14px;outline:none;padding:0}
  .vals{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:9px}
  .v{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px}
  .v .k{font-size:11px;color:var(--dim)} .v .n{font-size:16px;font-variant-numeric:tabular-nums}
  .v .u{font-size:11px;color:var(--dim)}
  .v.hi{border-color:var(--acc)}
  .pill{font-size:13px;font-weight:700;padding:4px 12px;border-radius:999px;border:1px solid var(--warn);color:var(--warn);
        display:inline-block;margin-bottom:8px}
  .chk{font-size:12.5px;display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dashed var(--line)}
  .chk:last-child{border-bottom:0}
  .ok{color:var(--ok)} .bad{color:var(--warn)}
  .note{font-size:12.5px;color:var(--dim);margin-top:8px}
  .note b{color:var(--txt)}
  svg{width:100%;height:auto;display:block;background:var(--bg);border-radius:8px}
  .steps{font-size:12.5px;color:var(--dim);line-height:1.9;margin-top:6px}
  .steps b{color:var(--txt)}
</style>
</head>
<body>

<h1>가우스 법칙 ∮E·dA = Q_enc/ε₀</h1>
<div class="sub">전자장 · 점·선·평면·구 대칭 — 닫힌 면을 잡아 전계를 한 번에 구하기</div>

<div class="card">
  <div class="grid" style="grid-template-columns:1fr 1fr">
    <div class="fld"><label>전하 분포</label>
      <select id="src">
        <option value="point">점전하 Q</option>
        <option value="line">무한 선전하 λ (⊙ 화면 밖)</option>
        <option value="plane">무한 평면전하 σ</option>
        <option value="sphere">균일 대전 구 (반지름 R)</option>
      </select></div>
    <div class="fld"><label>전하량 Q / λ / σ (nC 계열)</label>
      <input id="q" type="range" min="1" max="50" step="0.5" value="10"></div>
  </div>
  <div class="grid" style="grid-template-columns:1fr 1fr 90px;margin-top:9px;align-items:center">
    <div class="fld" id="rBox"><label>가우스면 반지름 r (cm)</label>
      <input id="r" type="range" min="0.5" max="30" step="0.1" value="8"></div>
    <div class="fld" id="RBox" style="display:none"><label>구 반지름 R (cm)</label>
      <input id="R" type="range" min="2" max="15" step="0.1" value="5"></div>
    <div class="fld"><label>r 값</label><input id="rv" type="number" step="0.1" value="8"></div>
  </div>
</div>

<div class="card"><div id="status"></div><div class="vals" id="vals"></div></div>

<div class="card">
  <div style="font-size:13px;font-weight:600;margin-bottom:8px">단면 — 점선이 가우스면 · 화살표 길이 = |E| (면 위에서는 모두 같다!)</div>
  <svg id="sec" viewBox="0 0 940 310"></svg>
</div>

<div class="card">
  <div style="font-size:13px;font-weight:600;margin-bottom:8px">E(r) — 패턴과 현재 위치</div>
  <svg id="gr" viewBox="0 0 940 250"></svg>
</div>

<div class="card">
  <div style="font-size:13px;font-weight:600;margin-bottom:8px">풀이 과정</div>
  <div class="steps" id="steps"></div>
</div>

<div class="card">
  <div style="font-size:13px;font-weight:600;margin-bottom:8px">검산</div>
  <div id="checks"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const fmt=(v,d)=>{d=(d===undefined)?3:d;
  if(Math.abs(v)>=1e4||Math.abs(v)<1e-2){const e=Math.floor(Math.log10(Math.abs(v)||1));
    return (v/Math.pow(10,e)).toFixed(2)+'e'+e;}
  return v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});};
const EPS0=8.8541878128e-12, K=1/(4*Math.PI*EPS0);

function P(){
  return {src:$('src').value,
          q:(parseFloat($('q').value)||1)*1e-9,     /* nC 계열 → C */
          r:(parseFloat($('r').value)||1)*1e-2,     /* cm → m */
          R:(parseFloat($('R').value)||5)*1e-2};
}

/* 가우스 법칙으로 구한 E (V/m) — verify_gauss.py와 같은 식 */
function Eof(p,r){
  if(p.src==='point') return {E:K*p.q/(r*r), A:4*Math.PI*r*r, Q:p.q, pat:'E ∝ 1/r²'};
  if(p.src==='line'){const lam=p.q*100;                     /* nC/m 로 해석: q값 ×100 */
    return {E:lam/(2*Math.PI*EPS0*r), A:2*Math.PI*r*1, Q:lam*1, pat:'E ∝ 1/r'};}
  if(p.src==='plane'){const sig=p.q;                        /* nC/m² 로 해석 */
    return {E:sig/(2*EPS0), A:2*Math.PI*r*r*0+2*1, Q:sig*1, pat:'E = const (r 무관)'};}
  /* sphere */
  const inside=r<p.R, Qin=inside? p.q*Math.pow(r/p.R,3) : p.q;
  return {E:K*Qin/(r*r), A:4*Math.PI*r*r, Q:Qin, pat:inside?'E ∝ r (내부 선형)':'E ∝ 1/r² (외부)'};
}

/* ---------- SVG ---------- */
function mk(tag,attrs){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);
  for(const k in attrs)e.setAttribute(k,attrs[k]);return e;}
const S=9; /* px per cm */
const CX=235, CY=155;
function arrow(s,from,to,color,w){
  s.appendChild(mk('line',{x1:from[0],y1:from[1],x2:to[0],y2:to[1],stroke:color,'stroke-width':w}));
  const ang=Math.atan2(to[1]-from[1],to[0]-from[0]), L=8;
  s.appendChild(mk('polygon',{points:to[0]+','+to[1]+' '+(to[0]-L*Math.cos(ang-0.42))+','+(to[1]-L*Math.sin(ang-0.42))+
    ' '+(to[0]-L*Math.cos(ang+0.42))+','+(to[1]-L*Math.sin(ang+0.42)),fill:color}));
}
function label(s,x,y,t,color,anchor){
  const e=mk('text',{x,y,fill:color||'#9aa7b4','font-size':12,'text-anchor':anchor||'start'});e.textContent=t;s.appendChild(e);}

function drawSec(p,res){
  const s=$('sec'); s.innerHTML='';
  const rr=p.r*S;
  s.appendChild(mk('line',{x1:CX-215,y1:CY,x2:CX+215,y2:CY,stroke:'#2a323d'}));
  s.appendChild(mk('line',{x1:CX,y1:CY-140,x2:CX,y2:CY+140,stroke:'#2a323d'}));

  if(p.src==='sphere'){
    s.appendChild(mk('circle',{cx:CX,cy:CY,r:p.R*S,fill:'rgba(248,81,73,.14)',stroke:'#f85149','stroke-width':1.4}));
    label(s,CX+p.R*S+6,CY-6,'R='+fmt(p.R*100,1)+'cm','#f85149');
  }
  if(p.src==='plane'){
    s.appendChild(mk('line',{x1:CX-215,y1:CY,x2:CX+215,y2:CY,stroke:'#f85149','stroke-width':3}));
    for(let x=-210;x<=210;x+=26) label(s,CX+x,CY-8,'+','#f85149','middle');
    /* 필박스 */
    const w=Math.min(rr,120);
    s.appendChild(mk('rect',{x:CX-w,y:CY-34,width:2*w,height:68,fill:'none',stroke:'#58a6ff','stroke-width':1.6,'stroke-dasharray':'9 6'}));
    label(s,CX-w,CY-40,'필박스 r='+fmt(p.r*100,1)+'cm','#58a6ff');
    const L=30;
    for(const [x0,dy] of [[-w/2,0],[0,0],[w/2,0]]){
      arrow(s,[CX+x0,CY-2],[CX+x0,CY-2-L],'#3fb950',2);
      arrow(s,[CX+x0,CY+2],[CX+x0,CY+2+L],'#3fb950',2);
    }
    label(s,CX+120,CY-60,'위·아래 면에서 |E| 항상 같음','#3fb950');
    label(s,CX-212,CY+70,'옆면은 E에 평행 → 플럭스 0','#9aa7b4');
    return;
  }
  /* point / line / sphere: 가우스 원 */
  s.appendChild(mk('circle',{cx:CX,cy:CY,r:rr,fill:'none',stroke:'#58a6ff','stroke-width':1.6,'stroke-dasharray':'9 6'}));
  label(s,CX+rr*0.71,CY-rr*0.71-8,'r='+fmt(p.r*100,1)+'cm','#58a6ff');
  if(p.src==='line'){
    s.appendChild(mk('circle',{cx:CX,cy:CY,r:9,fill:'none',stroke:'#f85149','stroke-width':2}));
    s.appendChild(mk('circle',{cx:CX,cy:CY,r:2.4,fill:'#f85149'}));
    label(s,CX+14,CY+4,'λ (화면 밖 ⊙)','#f85149');
  }else{
    s.appendChild(mk('circle',{cx:CX,cy:CY,r:6,fill:'#f85149'}));
    label(s,CX+10,CY-10,p.src==='point'?'+Q':'구 내부 ρ','#f85149');
  }
  /* 면 위 화살표 8개 — 대칭 때문에 길이 전부 동일 */
  const L=26;
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4;
    arrow(s,[CX+rr*Math.cos(a),CY-rr*Math.sin(a)],
            [CX+(rr+L)*Math.cos(a),CY-(rr+L)*Math.sin(a)],'#3fb950',2);
  }
  label(s,CX+10,CY-120,'면 위 모든 점에서 |E| 동일 (대칭) → E를 적분 밖으로','#3fb950');
}

function drawGraph(p){
  const s=$('gr'); s.innerHTML='';
  const X0=70,X1=910,Y0=24,Y1=200;
  const rmax=0.30; /* 30cm */
  const ex=r=>Eof(p,r).E;
  let emax=0; for(let r=0.005;r<=rmax;r+=0.003) emax=Math.max(emax,ex(r));
  s.appendChild(mk('line',{x1:X0,y1:Y1,x2:X1,y2:Y1,stroke:'#2a323d'}));
  s.appendChild(mk('line',{x1:X0,y1:Y0,x2:X0,y2:Y1,stroke:'#2a323d'}));
  label(s,X0-8,Y0+8,fmt(emax,0),'#9aa7b4','end');
  label(s,X0-8,Y1,'0','#9aa7b4','end');
  let d='';
  for(let r=0.004;r<=rmax;r+=0.002){
    const x=X0+(r/rmax)*(X1-X0), y=Y1-(ex(r)/emax)*(Y1-Y0)*0.92;
    d+=(d?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);
  }
  s.appendChild(mk('path',{d,fill:'none',stroke:'#3fb950','stroke-width':2.4}));
  const xm=X0+(p.r/rmax)*(X1-X0), ym=Y1-(ex(p.r)/emax)*(Y1-Y0)*0.92;
  s.appendChild(mk('line',{x1:xm,y1:Y0,x2:xm,y2:Y1,stroke:'#58a6ff','stroke-dasharray':'4 4'}));
  s.appendChild(mk('circle',{cx:xm,cy:ym,r:6,fill:'#58a6ff'}));
  label(s,xm+10,ym-8,'E('+fmt(p.r*100,1)+')','#58a6ff');
  if(p.src==='sphere'){
    const xR=X0+(p.R/rmax)*(X1-X0);
    s.appendChild(mk('line',{x1:xR,y1:Y0,x2:xR,y2:Y1,stroke:'#f85149','stroke-dasharray':'4 4'}));
    label(s,xR+6,Y0+12,'R','#f85149');
  }
  for(const t of [5,10,15,20,25,30])
    label(s,X0+(t/100/rmax)*(X1-X0),Y1+16,t,'#9aa7b4','middle');
  label(s,(X0+X1)/2,Y1+32,'r (cm)','#9aa7b4','middle');
  label(s,X0+8,Y0+12,'E(r)','#3fb950');
}

function render(){
  const p=P();
  $('rv').value=fmt(p.r*100,1);
  $('RBox').style.display=(p.src==='sphere')?'':'none';
  $('rBox').querySelector('label').textContent='가우스면 반지름 r (cm)';
  const res=Eof(p,p.r);

  let head='';
  if(p.src==='plane'){const q=(parseFloat($('q').value)||1);
    head='<span class="pill">σ = '+fmt(q,1)+' nC/m² · E가 r에 무관 — 이게 평면 대칭의 힘</span>';}
  else if(p.src==='sphere'&&p.r<p.R)
    head='<span class="pill">r &lt; R: 밖의 전하는 플럭스 0 기여 → Q_enc = Q·(r/R)³ 만 세면 된다</span>';
  else if(p.src==='line')
    head='<span class="pill">원통면: 옆면만 플럭스 → E·2πrL = λL/ε₀</span>';
  else
    head='<span class="pill">구면: E·4πr² = Q/ε₀ → E = Q/(4πε₀r²)</span>';
  $('status').innerHTML=head;

  const kv=res.E/1000;
  $('vals').innerHTML=
    '<div class="v hi"><div class="k">E(r)</div><div class="n">'+fmt(kv,2)+'</div><div class="u">kV/m</div></div>'+
    '<div class="v"><div class="k">Q_enc (가우스면 안)</div><div class="n">'+fmt(res.Q*1e9,2)+'</div><div class="u">nC'+(p.src==='sphere'&&p.r<p.R?' (전체의 '+fmt(100*Math.pow(p.r/p.R,3),1)+'%)':'')+'</div></div>'+
    '<div class="v"><div class="k">Φ = E·A</div><div class="n">'+fmt(res.E*res.A,2)+'</div><div class="u">V·m</div></div>'+
    '<div class="v"><div class="k">패턴</div><div class="n" style="font-size:13px">'+res.pat+'</div><div class="u">'+(p.src==='line'?'λ=':''+(p.src==='plane'?'σ=':''))+'</div></div>';

  drawSec(p,res); drawGraph(p);

  /* 풀이 과정 */
  const E='<b>'+fmt(res.E,2)+'</b> V/m';
  let st='';
  if(p.src==='point')
    st='① 대칭(구) → 면 위 |E| 일정<br>② Φ = E·<b>4πr²</b> = Q_enc/ε₀ = <b>'+fmt(p.q*1e9,1)+'nC</b>/ε₀<br>'+
       '③ E = Q/(4πε₀r²) = '+E+'<br>④ 검증: E(r/2)/E(r) = 4';
  else if(p.src==='line')
    st='① 대칭(원통) → 옆면만 기여, 위·아래는 E⊥dA → 0<br>② Φ = E·<b>2πrL</b> = λL/ε₀ → L 약분<br>'+
       '③ E = λ/(2πε₀r) = '+E+'<br>④ 검증: E·r = λ/(2πε₀) 일정';
  else if(p.src==='plane')
    st='① 대칭(필박스) → 위·아래 두 면에서 같은 E, 옆면 0<br>② Φ = E·<b>2A</b> = σA/ε₀ → A 약분<br>'+
       '③ E = σ/(2ε₀) = '+E+' — <b>r이 사라졌다</b><br>④ 검증: E(5cm) = E(15cm)';
  else
    st=(p.r<p.R?
       '① r &lt; R: 면 안 전하만 Q_enc = ρ·(4/3)πr³ = Q·(r/R)³ = <b>'+fmt(res.Q*1e9,2)+'nC</b><br>'+
       '② Φ = E·4πr² = Q_enc/ε₀<br>③ E = Q·r/(4πε₀R³) = '+E+' → 내부에서 <b>선형 증가</b>':
       '① r ≥ R: Q_enc = Q 전체 = <b>'+fmt(res.Q*1e9,1)+'nC</b> (밖의 껍질은 상쇄)<br>'+
       '② Φ = E·4πr² = Q/ε₀<br>③ E = Q/(4πε₀r²) = '+E+' → 밖에서는 점전하와 동일');
  $('steps').innerHTML=st;

  buildChecks(p,res);
}

function buildChecks(p,res){
  const rows=[]; let all=true;
  /* 1. 플럭스 항등식: E·A = Q_enc/ε₀ */
  const lhs=res.E*res.A, rhs=res.Q/EPS0;
  const ok1=Math.abs(lhs-rhs)/Math.max(Math.abs(rhs),1e-30)<1e-9;
  rows.push(['Φ = E·A vs Q_enc/ε₀',fmt(lhs,2)+' = '+fmt(rhs,2),ok1]); all&=ok1;

  /* 2. 패턴 검증 */
  let ok2,desc2;
  if(p.src==='point'){
    const E2=Eof(p,p.r/2).E, ratio=E2/res.E;
    ok2=Math.abs(ratio-4)<1e-6; desc2='E(r/2)/E(r) = '+fmt(ratio,3)+' (기대 4)';
  }else if(p.src==='line'){
    const c1=res.E*p.r, c2=Eof(p,p.r*2).E*p.r*2;
    ok2=Math.abs(c1-c2)/c1<1e-9; desc2='E·r 두 반지름에서 일치 ('+fmt(c1,2)+')';
  }else if(p.src==='plane'){
    const e5=Eof(p,0.05).E, e15=Eof(p,0.15).E;
    ok2=e5===e15; desc2='E(5cm) = E(15cm) = '+fmt(e5,2);
  }else{
    const Ein=Eof(p,p.R*0.999).E, Eout=Eof(p,p.R*1.001).E;
    ok2=Math.abs(Ein-Eout)/Eout<1e-3; desc2='r=R에서 연속 (内外 일치)';
  }
  rows.push(['패턴 검증',desc2,ok2]); all&=ok2;

  /* 3. 대칭성: 표면 위 방향 무관 (point/line/sphere) */
  if(p.src!=='plane'){
    const E2=Eof({src:p.src,q:p.q,r:p.r,R:p.R},p.r).E;
    const ok3=(E2===res.E); rows.push(['면 위 |E| 균일 (대칭 가정 성립)','동일 코드 경로',ok3]); all&=ok3;
  }else{
    const ok3=Math.abs(res.E*2*EPS0-p.q)<1e-15;
    rows.push(['σ/(2ε₀) 복원','E·2ε₀ = σ',ok3]); all&=ok3;
  }

  /* 4. 쿨롱 직접합(근사) — 선전하는 유한선 공식과 비교 */
  if(p.src==='line'){
    const lam=p.q*100, L=400, N=400000; let Ex=0;
    for(let i=0;i<N;i++){const z=-L/2+L*(i+0.5)/N;
      Ex+=K*(lam*L/N)*p.r/Math.pow(p.r*p.r+z*z,1.5);}
    const inf=lam/(2*Math.PI*EPS0*p.r);
    const corr=(L/2)/Math.hypot(L/2,p.r);
    const ok4=Math.abs(Ex-inf*corr)/Ex<1.5e-3;
    rows.push(['유한선 쿨롱 합 vs 유한선 해석해 ('+N+'조각)','상대오차 <0.15%',ok4]); all&=ok4;
  }else{
    const ok4=true; rows.push(['가우스 경로 = 유일 경로 (대칭이 전제)','—',null]);
  }

  let h=''; for(const [k,v,ok] of rows)
    h+='<div class="chk"><span>'+k+'</span><span class="'+(ok===null?'':ok?'ok':'bad')+'">'+v+
       (ok===null?'':ok?' ✓ PASS':' ✗ FAIL')+'</span></div>';
  h+='<div class="chk"><span><b>RESULT</b></span><span class="'+(all?'ok':'bad')+'">'+(all?'ALL PASS':'FAIL')+'</span></div>';
  $('checks').innerHTML=h;
}

$('src').onchange=render; $('q').oninput=render;
$('r').oninput=()=>{$('rv').value=fmt(parseFloat($('r').value),1);render();};
$('rv').onchange=()=>{let v=parseFloat($('rv').value);
  if(!isNaN(v)){$('r').value=Math.min(30,Math.max(0.5,v));}render();};
$('R').oninput=render;
render();
</script>
</body>
</html>
